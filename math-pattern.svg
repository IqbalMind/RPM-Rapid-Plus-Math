<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <style>
      .icon { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .solid { fill: currentColor; }
    </style>
  </defs>

  <!-- Plus (+) at (40, 40) -->
  <g transform="translate(40, 40) rotate(10)" class="icon">
    <line x1="0" y1="-12" x2="0" y2="12" />
    <line x1="-12" y1="0" x2="12" y2="0" />
  </g>

  <!-- Multiply (x) at (160, 40) -->
  <g transform="translate(160, 40) rotate(45)" class="icon">
    <line x1="0" y1="-10" x2="0" y2="10" />
    <line x1="-10" y1="0" x2="10" y2="0" />
  </g>

  <!-- Minus (-) at (100, 75) -->
  <g transform="translate(100, 75) rotate(-5)" class="icon">
    <line x1="-10" y1="0" x2="10" y2="0" />
  </g>

  <!-- Divide (/) at (200, 110) -->
  <g transform="translate(200, 110)" class="icon">
    <line x1="-12" y1="0" x2="12" y2="0" />
    <circle cx="0" cy="-6" r="1.8" class="solid" />
    <circle cx="0" cy="6" r="1.8" class="solid" />
  </g>

  <!-- Square Root (sqrt) at (35, 120) -->
  <g transform="translate(35, 120)" class="icon">
    <polyline points="-12,4 -7,4 -3,12 5,-10 16,-10" />
  </g>

  <!-- Equals (=) at (120, 140) -->
  <g transform="translate(120, 140) rotate(8)" class="icon">
    <line x1="-10" y1="-4" x2="10" y2="-4" />
    <line x1="-10" y1="4" x2="10" y2="4" />
  </g>

  <!-- Pi (pi) at (175, 185) -->
  <g transform="translate(175, 185) rotate(-10)" class="icon">
    <line x1="-10" y1="-7" x2="10" y2="-7" />
    <path d="M-5,-7 v14" />
    <path d="M5,-7 v14 c0,2 2,2 3,0" />
  </g>

  <!-- Percent (%) at (65, 195) -->
  <g transform="translate(65, 195) rotate(15)" class="icon">
    <line x1="-9" y1="9" x2="9" y2="-9" />
    <circle cx="-6" cy="-6" r="2.5" />
    <circle cx="6" cy="6" r="2.5" />
  </g>

  <!-- Infinity (inf) at (205, 30) -->
  <g transform="translate(205, 30) rotate(-15)" class="icon">
    <path d="M-8,0 c-4,-4 -8,-3 -8,0 s4,4 8,0 c4,-4 8,-3 8,0 s-4,4 -8,0 Z" />
  </g>

  <!-- Plus (+) at (125, 220) -->
  <g transform="translate(125, 220) rotate(-20)" class="icon">
    <line x1="0" y1="-8" x2="0" y2="8" />
    <line x1="-8" y1="0" x2="8" y2="0" />
  </g>

  <!-- Numbers (1, 2, 3) as playful outlines -->
  <text x="110" y="32" font-family="Nunito, sans-serif" font-size="14" font-weight="900" fill="currentColor" opacity="0.9">1</text>
  <text x="15" y="70" font-family="Nunito, sans-serif" font-size="14" font-weight="900" fill="currentColor" opacity="0.9">2</text>
  <text x="145" y="105" font-family="Nunito, sans-serif" font-size="14" font-weight="900" fill="currentColor" opacity="0.9">3</text>
  <text x="215" y="165" font-family="Nunito, sans-serif" font-size="13" font-weight="900" fill="currentColor" opacity="0.9">7</text>
  <text x="20" y="175" font-family="Nunito, sans-serif" font-size="14" font-weight="900" fill="currentColor" opacity="0.9">8</text>

  <!-- Small dots and accent stars -->
  <circle cx="80" cy="20" r="1.5" class="solid" />
  <circle cx="15" cy="140" r="1.5" class="solid" />
  <circle cx="180" cy="75" r="1.5" class="solid" />
  <circle cx="85" cy="115" r="1.5" class="solid" />
  <circle cx="150" cy="155" r="1.5" class="solid" />
  <circle cx="225" cy="225" r="1.5" class="solid" />
  <circle cx="15" cy="225" r="1.5" class="solid" />
</svg>