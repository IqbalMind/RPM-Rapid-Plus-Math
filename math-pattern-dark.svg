<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <style>
      .icon { fill: none; stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-opacity: 0.15; }
      .solid { fill: #ffffff; fill-opacity: 0.15; }
      .txt { font-family: "Nunito", sans-serif; font-size: 15px; font-weight: 900; fill: #f1c40f; fill-opacity: 0.15; }
    </style>
  </defs>

  <!-- Plus (+) -->
  <g transform="translate(35, 35) rotate(12)" class="icon">
    <line x1="0" y1="-12" x2="0" y2="12" />
    <line x1="-12" y1="0" x2="12" y2="0" />
  </g>

  <!-- Multiply (x) -->
  <g transform="translate(150, 35) rotate(45)" class="icon">
    <line x1="0" y1="-10" x2="0" y2="10" />
    <line x1="-10" y1="0" x2="10" y2="0" />
  </g>

  <!-- Minus (-) -->
  <g transform="translate(90, 70) rotate(-6)" class="icon">
    <line x1="-10" y1="0" x2="10" y2="0" />
  </g>

  <!-- Divide (/) -->
  <g transform="translate(185, 100)" class="icon">
    <line x1="-11" y1="0" x2="11" y2="0" />
    <circle cx="0" cy="-6" r="1.8" class="solid" />
    <circle cx="0" cy="6" r="1.8" class="solid" />
  </g>

  <!-- Square Root -->
  <g transform="translate(30, 110)" class="icon">
    <polyline points="-10,3 -6,3 -3,11 5,-9 15,-9" />
  </g>

  <!-- Equals (=) -->
  <g transform="translate(110, 130) rotate(8)" class="icon">
    <line x1="-9" y1="-4" x2="9" y2="-4" />
    <line x1="-9" y1="4" x2="9" y2="4" />
  </g>

  <!-- Pi (pi) -->
  <g transform="translate(160, 175) rotate(-10)" class="icon">
    <line x1="-9" y1="-7" x2="9" y2="-7" />
    <path d="M-5,-7 v14" />
    <path d="M5,-7 v14 c0,2 2,2 3,0" />
  </g>

  <!-- Percent (%) -->
  <g transform="translate(60, 180) rotate(15)" class="icon">
    <line x1="-8" y1="8" x2="8" y2="-8" />
    <circle cx="-5" cy="-5" r="2.2" />
    <circle cx="5" cy="5" r="2.2" />
  </g>

  <!-- Infinity -->
  <g transform="translate(190, 30) rotate(-15)" class="icon">
    <path d="M-7,0 c-3.5,-3.5 -7,-2.5 -7,0 s3.5,3.5 7,0 c3.5,-3.5 7,-2.5 7,0 s-3.5,3.5 -7,0 Z" />
  </g>

  <!-- Small Plus -->
  <g transform="translate(115, 205) rotate(-18)" class="icon">
    <line x1="0" y1="-7" x2="0" y2="7" />
    <line x1="-7" y1="0" x2="7" y2="0" />
  </g>

  <!-- Playful Numbers -->
  <text x="100" y="32" class="txt">1</text>
  <text x="12" y="70" class="txt">2</text>
  <text x="135" y="95" class="txt">3</text>
  <text x="195" y="155" class="txt">7</text>
  <text x="15" y="165" class="txt">8</text>

  <!-- Accent dots -->
  <circle cx="75" cy="20" r="1.5" class="solid" />
  <circle cx="15" cy="130" r="1.5" class="solid" />
  <circle cx="165" cy="70" r="1.5" class="solid" />
  <circle cx="80" cy="110" r="1.5" class="solid" />
  <circle cx="140" cy="145" r="1.5" class="solid" />
  <circle cx="205" cy="205" r="1.5" class="solid" />
  <circle cx="15" cy="205" r="1.5" class="solid" />
</svg>